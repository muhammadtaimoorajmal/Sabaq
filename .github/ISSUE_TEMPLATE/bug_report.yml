name: Bug report
description: Something does not work as it should.
title: '[Bug] '
labels: ['bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and browser
      placeholder: 'e.g. Windows 11, Edge 131'
  - type: textarea
    id: logs
    attributes:
      label: Error messages or screenshots
      description: Remove any personal data before pasting.
